name: Deploy Release to S3

# This script creates a zip file and uploads to s3
# An IAM role must present to provide permissions 

# Set the following in GitHub environment secrets and variables:
# Secrets:
#   AWS_RELEASE_ACCT
#   AWS_RELEASE_REGION
# Variables:
#   AWS_RELEASE_BUCKET - bucket to upload artifact to
#   AWS_RELEASE_BUCKET_UTILS_PATH - Must be single / or begin and end with /
#


on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_RELEASE_ACCT }}:role/github-actions-role
          aws-region: ${{ secrets.AWS_RELEASE_REGION }}

      - name: Copy release to S3
        run: |
          # Name of File
          export ZIP_FILE_NAME=agent_assets
          
          # Publish only these folders from examples/ (zip + S3 sync).
          # Anything else in examples/ (e.g. mcp/) is intentionally excluded.
          # Staging both outputs from the same folder keeps them identical.
          INCLUDE_DIRS="agents-md hooks steering"
          rm -rf .release
          for d in $INCLUDE_DIRS; do
            mkdir -p ".release/$d"
            # hooks/ may be empty (and untracked by git), so only copy if it exists
            if [ -d "examples/$d" ]; then
              cp -a "examples/$d/." ".release/$d/"
            fi
          done

          # Create a zip of the staged release - we'll rename it during upload
          # cd into the staging dir so stored paths are relative to it
          # (agents-md/AGENTS.md is stored as agents-md/AGENTS.md in the zip)
          (cd .release && zip -r ../release.zip .)
          
          # Copy the zip to S3
          aws s3 cp release.zip s3://${{ vars.AWS_RELEASE_BUCKET }}${{ vars.AWS_RELEASE_BUCKET_UTILS_PATH }}${ZIP_FILE_NAME}.zip

          # Also copy the unzipped, staged contents to the same prefix (no .zip)
          # (agents-md/AGENTS.md becomes ${ZIP_FILE_NAME}/agents-md/AGENTS.md)
          # --delete mirrors the prefix, removing anything previously published
          # that is no longer part of the release (e.g. old mcp/ files)
          aws s3 sync .release/ s3://${{ vars.AWS_RELEASE_BUCKET }}${{ vars.AWS_RELEASE_BUCKET_UTILS_PATH }}${ZIP_FILE_NAME}/ --delete
